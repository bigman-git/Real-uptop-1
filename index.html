<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uptop Mobile Wireframe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="brand-logo">Uptop</div>
      <div class="search-container">
        <input type="text" class="search-input" placeholder="Search...">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
      </div>
      <button class="menu-btn" aria-label="Open menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <nav class="pills-nav">
      <button class="pill-item active">Laptops</button>
      <button class="pill-item">Accessories</button>
      <button class="pill-item">Services</button>
      <button class="pill-item">Desktops</button>
    </nav>

    <section class="carousel-container" id="carousel">
      <button class="carousel-arrow prev" id="prevBtn" aria-label="Previous Slide">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-slide">
          <h2 class="carousel-title">Featured Product</h2>
          <p class="carousel-subtitle">Short promotional details here</p>
          <button class="btn-primary">Buy Now</button>
        </div>
        <div class="carousel-slide">
          <h2 class="carousel-title">Pro Accessories</h2>
          <p class="carousel-subtitle">Up to 30% off tech gear</p>
          <button class="btn-primary">Explore Deals</button>
        </div>
        <div class="carousel-slide">
          <h2 class="carousel-title">New Arrivals</h2>
          <p class="carousel-subtitle">Discover high-performance laptops</p>
          <button class="btn-primary">Shop Collection</button>
        </div>
      </div>

      <button class="carousel-arrow next" id="nextBtn" aria-label="Next Slide">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <div class="carousel-dots" id="carouselDots">
        <span class="dot active" data-slide="0"></span>
        <span class="dot" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
      </div>
    </section>

    <section class="categories-section">
      <div class="section-header">
        <h3 class="section-title">Shop by Category</h3>
        <a href="#" class="view-all">View All</a>
      </div>

      <div class="categories-grid">
        <a href="#" class="category-card">
          <div class="icon-wrapper"><i class="fa-solid fa-laptop"></i></div>
          <span class="category-label">Laptops</span>
        </a>
        <a href="#" class="category-card">
          <div class="icon-wrapper"><i class="fa-solid fa-gamepad"></i></div>
          <span class="category-label">Gaming</span>
        </a>
        <a href="#" class="category-card">
          <div class="icon-wrapper"><i class="fa-solid fa-plug"></i></div>
          <span class="category-label">Chargers</span>
        </a>
        <a href="#" class="category-card">
          <div class="icon-wrapper"><i class="fa-solid fa-compact-disc"></i></div>
          <span class="category-label">Software</span>
        </a>
      </div>
    </section>

    <section class="featured-section">
      <div class="section-header">
        <h3 class="section-title">Featured List</h3>
      </div>
      <div class="featured-list">
        <div class="product-card-skeleton">
          <div class="skeleton-img"></div>
          <div class="skeleton-text-group">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </div>
        </div>
        <div class="product-card-skeleton">
          <div class="skeleton-img"></div>
          <div class="skeleton-text-group">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="jss/java.js"></script>
</body>
</html>
